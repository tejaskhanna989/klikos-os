# KlikOS system configuration
# /etc/klikos/system.conf (on target device)

[system]
hostname=klikos
version=0.1.0
build=pre-alpha

[boot]
kernel=/boot/klikos.elf
console=ttyAMA0,115200

[display]
server=/bin/display-server
wm=/bin/window-manager

[apps]
launcher=/bin/launcher
settings=/bin/settings
files=/bin/files
terminal=/bin/terminal

[framework]
activity=/bin/framework
package=/bin/framework
window=/bin/framework
resource=/bin/framework

[runtime]
path=/bin/runtime

[network]
enabled=false

[storage]
root=/dev/vda2
